name: Publish to Google Play

# Uploads the App Bundle built by release.yml to Google Play, which resigns it
# into per-device APKs of its own. Called by release.yml and nothing else; to
# run it again after a rejection, use the failed-jobs button on the release run
# rather than rebuilding, so what reaches Play is the bundle that was checked.
#
# THE FIRST UPLOAD CANNOT COME FROM HERE. The Play Developer API refuses to
# create an app's first release: a bundle has to go up through the Play Console
# by hand once, after which this owns every release. The Google Play section of
# CLAUDE.md has that and the rest of the one-time setup.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release whose notes become the Play release notes
        required: true
        type: string
      version:
        description: Version the bundle is named after, and the Play release name
        required: true
        type: string
      version_code:
        description: Reported in the summary; the value is already inside the bundle
        required: true
        type: string
      package:
        description: Application id to upload under, read from Gradle by the build
        required: true
        type: string
      publish:
        description: Send the release live immediately instead of leaving a draft
        required: false
        default: false
        type: boolean
    secrets:
      service_account_json:
        description: JSON key for a service account with release permissions on the app
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Narrower than the build: this reads a release and uploads to Google.
    # Nothing here writes to the repository or mints an attestation.
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      BUNDLE: dist/prosefchi-${{ inputs.version }}.aab
      # Stated once for the same reason STATUS is: the value uploaded and the
      # value reported below must be one reading, or switching to an internal
      # track leaves the summary claiming a production release that never
      # happened.
      TRACK: production
      # A draft unless the run was dispatched with publish ticked. Play has no
      # undo worth the name: a live release can be halted, but not taken back
      # off the phones that already took it. So the default leaves the last step
      # to a person, and the flag is there for when that person has already
      # decided. Same line the signer check draws in the build — CI does
      # everything that can be checked and stops short of what cannot be undone.
      STATUS: ${{ inputs.publish && 'completed' || 'draft' }}
    steps:
      # A fast job, so this costs little wherever it sits, but it stays first
      # for the same reason the keystore check does in the build.
      - name: Check the service account is configured
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.service_account_json }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not available to this repository"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      # Play's release notes field is capped at 500 characters and rejects the
      # upload rather than truncating, so the GitHub release body cannot simply
      # be passed through.
      #
      # Over the cap the notes are dropped rather than cut, and loudly. A store
      # listing ending mid-sentence is worse than one whose notes were written
      # in the Console, and by default the release is a draft anyway — the
      # maintainer is already there.
      - name: Collect the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"

          if [ -z "$body" ]; then
            echo "::notice::Release $TAG has no notes; Play keeps whatever the listing already says"
            echo "directory=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(printf '%s' "$body" | wc -m)" -gt 500 ]; then
            echo "::warning title=Play release notes::Notes for $TAG are over Play's 500-character limit and were not uploaded; write them in the Console"
            echo "directory=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The filename is the API's, not ours: whatsnew-<BCP 47 locale>. Only
          # en-US, because the release body is written in English; the Greek
          # listing keeps whatever the Console holds rather than being handed
          # English text under a Greek locale.
          mkdir -p whatsnew
          printf '%s' "$body" > whatsnew/whatsnew-en-US
          echo "directory=whatsnew" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.service_account_json }}
          packageName: ${{ inputs.package }}
          releaseFile: ${{ env.BUNDLE }}
          releaseName: ${{ inputs.version }}
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          # Empty where the notes were skipped above, which the action reads as
          # having none rather than as a missing directory.
          whatsNewDirectory: ${{ steps.notes.outputs.directory }}

      - name: Report what reached Play
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          {
            echo "### Google Play"
            echo
            echo '```'
            echo "package       $PACKAGE"
            echo "version       $VERSION"
            echo "version code  $VERSION_CODE"
            echo "track         $TRACK"
            echo "status        $STATUS"
            echo '```'
            if [ "$STATUS" = draft ]; then
              echo
              echo '> [!NOTE]'
              echo '> The release is a draft and reaches nobody until it is sent for review'
              echo "> from the Play Console, or until Release is re-run for $TAG with"
              echo '> **publish** ticked.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
