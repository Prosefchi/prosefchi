name: Publish to GitHub

# Attaches the APK built by release.yml to the GitHub release, together with a
# signed provenance attestation. This is the channel Obtainium follows and the
# one anyone downloading by hand uses, so the file here is installed as it is,
# unlike the bundle Play repackages.
#
# Called by release.yml and nothing else — it has no trigger of its own, since
# there is no APK to attach without the build that produced it. To run it again
# after a failure, use the failed-jobs button on the release run: the artifact
# is still there and no rebuild is needed.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to attach the assets to
        required: true
        type: string
      version:
        description: Version the artifacts are named after
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # record the attestation against the repository
    env:
      TAG: ${{ inputs.tag }}
      # The asset name once, because the attestation records its subject by
      # name: the file attested and the file uploaded have to be the same
      # string, and a mismatch fails here, after the release is already public.
      APK: prosefchi-${{ inputs.version }}.apk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      # Because nothing is built on a maintainer's machine, the attestation is
      # a claim anyone downloading the APK can check for themselves:
      #
      #   gh attestation verify prosefchi-0.0.1.apk --repo Prosefchi/prosefchi
      #
      # It runs against the file under the name it is published as, so the asset
      # on the release and the subject in the attestation read the same. Only
      # the APK is attested: it is the file people download and run, whereas the
      # bundle is an input to Play, which resigns and repackages it into APKs
      # this workflow never sees and no attestation made here could cover.
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ env.APK }}

      - name: Attach the APK and its attestation to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/$APK.sigstore.json"
          # --clobber so re-running a partially failed publish replaces the
          # assets instead of failing on the ones already there.
          gh release upload "$TAG" \
            "dist/$APK" \
            "dist/$APK.sigstore.json" \
            --clobber

      - name: Report what was published
        run: |
          set -euo pipefail
          {
            echo "### GitHub release $TAG"
            echo
            echo '```'
            (cd dist && sha256sum "$APK")
            echo '```'
            echo
            echo 'Check the download against this build:'
            echo
            echo '```'
            echo "gh attestation verify $APK --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
