name: Pages

# Publishes everything that lives on GitHub Pages: the calendar JSON the app
# fetches, and the web frontend that reads the same JSON.
#
# The two are built by separate jobs. They share a destination and nothing else
# — one downloads ~32 MB of iCal from GOARCH and reduces it, the other renders
# prayers through the app's parser and compiles the day view to JavaScript —
# and keeping them apart means a failure names which of the two broke, and the
# calendar's feed-runway reporting sits with the calendar rather than in the
# middle of a job that also builds a website.
#
# What joins them is the deploy and only the deploy: a Pages deploy replaces
# the whole site with the uploaded artifact, so publishing needs both halves in
# hand. A run that uploaded only the calendar would take the web frontend down
# until the next push, and one that uploaded only the site would strip the
# calendar out from under every client. So each job uploads its own build as an
# ordinary artifact and `deploy` merges them into the one directory Pages gets.

on:
  schedule:
    # Deliberately off the hour: GitHub queues scheduled runs heavily at :00 and
    # delays are routine. Nothing here is time-critical, so a late run is fine.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    # Path filters are per workflow and cannot be narrowed to one job, which
    # costs nothing here: every deploy republishes both halves regardless of
    # which one an edit touched, so there is no run this list could usefully
    # shorten.
    paths:
      - 'tool/build_calendar.dart'
      - 'tool/build_site.dart'
      - 'lib/models/calendar.dart'
      # The site compiles the liturgics into its JavaScript and renders the
      # prayers through the app's own parser, so a change to any of them
      # changes what is published.
      - 'lib/liturgics/**'
      - 'lib/models/markup.dart'
      - 'lib/models/prayer.dart'
      - 'lib/l10n/*.arb'
      - 'site/**'
      - 'res/prayers/**'
      - 'pubspec.yaml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a scheduled run
# cannot discard a manually triggered one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The gate, in front of both builds rather than inside either. The generator
  # writes through lib/models/calendar.dart and the site renders through
  # lib/models/markup.dart, so a break in either would publish something wrong
  # to every client. Running it here also means a red suite costs nothing
  # downstream — in particular upstream is never asked for its ~32 MB.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tools are plain Dart, but pubspec.yaml depends on the Flutter SDK,
      # so `dart pub get` cannot resolve without Flutter present. Each job is a
      # fresh runner, so all three set it up; the action's cache makes that
      # cheap rather than free.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

  calendar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build calendar
        run: |
          set -eo pipefail
          dart run tool/build_calendar.dart --out public 2>&1 | tee build.log

      # The feed has a hard end date and simply stops rather than rolling
      # forward. Surface that on the run page, not just buried in the log.
      - name: Report feed runway
        run: |
          {
            echo '### Calendar build'
            echo
            echo '```'
            grep -E '^(en|el): [0-9]+ days|^  upstream last modified' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'WARNING' build.log; then
            grep 'WARNING' build.log | while read -r line; do
              echo "::warning title=Calendar feed runway::${line#*WARNING: }"
            done
            {
              echo
              echo '> [!WARNING]'
              grep 'WARNING' build.log | sed 's/^ *WARNING: /> /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: calendar
          path: public
          # An empty upload would deploy a site with no calendar in it, and the
          # app reads a missing file as "no entry for this day", so fail here
          # rather than publish that.
          if-no-files-found: error
          # Rebuilt daily and superseded by the deploy; nothing ever goes back
          # to yesterday's copy.
          retention-days: 1

  site:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build site
        run: dart run tool/build_site.dart --out public

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [calendar, site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Both into one directory. They write disjoint names — the site owns the
      # pages and their assets, the calendar owns calendar.<lang>.json at the
      # root — so the merge is a union rather than a decision about precedence.
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - uses: actions/download-artifact@v8
        with:
          name: calendar
          path: public

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
