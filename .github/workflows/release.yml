name: Release

# Builds a published release once and hands it to the two places it goes.
#
#   release published ──▶ build ──┬──▶ publish-github.yml   APK + attestation
#                                 └──▶ publish-play.yml     App Bundle
#
# One build, two destinations, so the bundle Play distributes and the APK on the
# release are the same build of the same commit rather than two builds that
# agree by coincidence. The publishers are separate files because they share a
# release and nothing else: they need different secrets and different token
# permissions, they fail for unrelated reasons, and either can be re-run without
# the other from the failed-jobs button on this run.
#
# THE FIRST UPLOAD TO PLAY CANNOT COME FROM HERE. The Play Developer API refuses
# to create an app's first release: a bundle has to go up through the Play
# Console by hand once, after which this workflow owns every release. See the
# Google Play section of CLAUDE.md for that, and for what has to be set up
# before publish-play.yml can work at all.

on:
  release:
    types: [published]
  # A failed upload would otherwise mean deleting and recreating the release,
  # which changes its timestamp and notifies watchers a second time.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true
      publish:
        description: >-
          Send the Play release live immediately instead of leaving it a draft
          to be reviewed in the Console
        type: boolean
        default: false

# The ceiling for the called workflows, which scope themselves down from it.
# Neither needs all three.
permissions:
  contents: write # attach assets to the release
  id-token: write # mint the short-lived Sigstore signing certificate
  attestations: write # record the attestation against the repository

# Queue rather than cancel: a superseded run here leaves a release published
# with no APK on it. Same reasoning as the Pages workflow, the opposite of
# the test one.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The tag is an output rather than read from `env` by the callers below: the
    # env context is not available in a `with:` block, so the expression would
    # otherwise have to be repeated in all three places.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event already points GITHUB_REF at the tag, but a manual
          # run would otherwise build whichever branch the UI defaulted to.
          ref: ${{ env.TAG }}

      # First, so a missing secret costs seconds rather than failing after the
      # SDK setup, the tests and a three-minute build. The keystore is held as
      # an organisation secret and only ever exists in the runner's temp
      # directory, never in the workspace where it could be picked up by a
      # later step or an artifact upload.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is not available to this repository"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Matches sourceCompatibility/targetCompatibility in
      # android/app/build.gradle.kts. The runner image carries several JDKs and
      # its default has moved before now; pinning stops that from quietly
      # changing what a release was built with.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec.yaml's version: is the only place the version lives, and Flutter
      # feeds it to both platforms. A tag that disagrees with it would ship an
      # APK reporting a version nobody released, and the about section reads
      # that value back out of the bundle. Fail before the build, not after the
      # assets are already attached.
      #
      # The version code is computed from that version rather than written down
      # anywhere, so the one place a version lives stays the one place. Play
      # orders releases by it and refuses any value it has ever accepted — not
      # merely the current one, but one from a release since deleted — so it has
      # to rise with every published version and can never be reused. A number
      # derived from the triple gets both right without anything to remember.
      #
      # pubspec carries no `+build` suffix and deliberately does not gain one: a
      # second number to bump is a second number to forget, and the punishment
      # for forgetting is an upload rejected after the release is already
      # public. Flutter defaults the build number to 1 when it is absent, which
      # is what every APK released so far reports — harmless for sideloading,
      # which refuses only a *lower* code, and unusable for Play.
      - name: Check the tag matches pubspec
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release $TAG does not match pubspec version $version"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not three dot-separated numbers"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"

          # 10# so a patch of 08 is eight rather than a bad octal literal. The
          # bound is what keeps the mapping one-to-one: without it 0.2.100 and
          # 0.3.0 compute the same code, and the second of them is rejected by
          # Play as a duplicate long after the mistake was made.
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::Version $version overflows the version code; minor and patch must stay below 100"
            exit 1
          fi
          code="$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"

          # Read out of Gradle rather than restated here, so the id the bundle
          # uploads under cannot drift from the id the app is built with.
          package="$(sed -n 's/^ *applicationId = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          if [ -z "$package" ]; then
            echo "::error::No applicationId found in android/app/build.gradle.kts"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "version_code=$code"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"
            echo "VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      # Cheap on a job that already has the SDK warm, and this is the one build
      # whose output cannot be quietly replaced once people have downloaded it.
      - run: flutter test

      # The signing material is scoped to these two steps rather than exported
      # for the whole job. android/app/build.gradle.kts reads these four and
      # falls back to the debug key when they are absent, which is why the check
      # below exists.
      #
      # Play takes a bundle and the GitHub release carries an APK, so both are
      # built, and they share a version code because they are one release
      # reaching people two ways. Someone who installed from Obtainium and later
      # installs from Play is moving sideways, not downgrading.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number="$VERSION_CODE"

      - name: Build the App Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      # The one failure this whole arrangement exists to prevent, and the one
      # that hides best: a debug-signed APK installs and runs perfectly, and
      # only announces itself at the *next* release, which will not install over
      # it. By then it has shipped. Assert on the signer rather than trusting
      # that the environment reached Gradle.
      #
      # The bundle is checked the same way for a slightly different reason. Play
      # would reject a debug-signed upload itself, since the key is registered
      # with them — but it rejects it as an unrecognised upload key, which reads
      # as a Play configuration problem rather than as a build that never saw
      # the secrets. Two tools, because an APK carries an APK Signature Scheme
      # block that apksigner reads and a bundle is a signed jar that it does not.
      #
      # It happens here rather than in either publisher because it is a fact
      # about the build, and because a publisher that trusted an artifact it
      # merely downloaded would be checking the wrong thing.
      - name: Check both artifacts are signed with the release key
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The release APK is signed with the debug key"
            exit 1
          fi
          echo "SIGNER=$(grep -m1 'SHA-256 digest' <<<"$certs" | awk '{print $NF}')" \
            >> "$GITHUB_ENV"

          bundle_certs="$(keytool -printcert -jarfile \
            build/app/outputs/bundle/release/app-release.aab)"
          echo "$bundle_certs"
          if grep -q 'CN=Android Debug' <<<"$bundle_certs"; then
            echo "::error::The App Bundle is signed with the debug key"
            exit 1
          fi

      # Named here rather than in the publishers, so both artifacts leave this
      # job under the name they will carry wherever they end up.
      - name: Name the artifacts after the release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/prosefchi-$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/prosefchi-$VERSION.aab"

      # Two artifacts rather than one, so each publisher downloads only what it
      # publishes. Both are signed but hold no secret the released APK does not;
      # the keystore stays in the runner's temp directory and reaches neither.
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/prosefchi-${{ env.VERSION }}.apk
          if-no-files-found: error
          # Long enough to re-run a publisher by hand days after a rejection,
          # short of keeping signed build output around indefinitely.
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/prosefchi-${{ env.VERSION }}.aab
          if-no-files-found: error
          retention-days: 7

      - name: Report what was built
        run: |
          set -euo pipefail
          {
            echo "### prosefchi-$VERSION"
            echo
            echo '```'
            (cd dist && sha256sum "prosefchi-$VERSION.apk" "prosefchi-$VERSION.aab")
            echo "signing certificate  $SIGNER"
            echo "version code         $VERSION_CODE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: build
    uses: ./.github/workflows/publish-github.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}

  play:
    needs: build
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.version_code }}
      package: ${{ needs.build.outputs.package }}
      # Absent on a release event, where `inputs` is empty and this is false.
      publish: ${{ inputs.publish == true }}
    secrets:
      service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
