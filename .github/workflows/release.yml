name: Release

# Builds a published release once and hands it to the two places it goes.
#
#   release published ──▶ build ──┬──▶ publish-github.yml   APK + attestation
#                                 └──▶ publish-play.yml     App Bundle
#
# One build, so the two carry the same commit and the same version code. Setting
# up Play publishing is documented under Google Play in CLAUDE.md.

on:
  release:
    types: [published]
  # A failed upload would otherwise mean deleting and recreating the release,
  # which changes its timestamp and notifies watchers a second time.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to
        required: true
      publish:
        description: >-
          Send the Play release live immediately instead of leaving it a draft
          to be reviewed in the Console
        type: boolean
        default: false

# The ceiling for the called workflows, which scope themselves down from it.
# Neither needs all three.
permissions:
  contents: write # attach assets to the release
  id-token: write # mint the short-lived Sigstore signing certificate
  attestations: write # record the attestation against the repository

# Queue rather than cancel: a superseded run here leaves a release published
# with no APK on it. Same reasoning as the Pages workflow, the opposite of
# the test one.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The tag is an output because the `env` context is unavailable in the
    # callers' `with:` blocks.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event already points GITHUB_REF at the tag, but a manual
          # run would otherwise build whichever branch the UI defaulted to.
          ref: ${{ env.TAG }}

      # First, so a missing secret costs seconds rather than failing after the
      # SDK setup, the tests and a three-minute build. The keystore is held as
      # an organisation secret and only ever exists in the runner's temp
      # directory, never in the workspace where it could be picked up by a
      # later step or an artifact upload.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is not available to this repository"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Matches sourceCompatibility/targetCompatibility in
      # android/app/build.gradle.kts. The runner image carries several JDKs and
      # its default has moved before now; pinning stops that from quietly
      # changing what a release was built with.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # A tag disagreeing with pubspec would ship an APK reporting a version
      # nobody released, so fail before the build rather than after the assets
      # are attached.
      #
      # The version code is derived from that version rather than kept as a
      # `+build` suffix, so there is only one number to bump. Play requires it to
      # rise with every release and never repeat, which a number computed from
      # the triple satisfies with nothing to remember.
      - name: Check the tag matches pubspec
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release $TAG does not match pubspec version $version"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not three dot-separated numbers"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"

          # 10# so a patch of 08 is eight, not a bad octal literal. The bound
          # keeps the mapping one-to-one: without it 0.2.100 and 0.3.0 compute
          # the same code, and Play rejects the second as a duplicate.
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::Version $version overflows the version code; minor and patch must stay below 100"
            exit 1
          fi
          code="$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"

          # From Gradle, so the id uploaded under cannot drift from the id
          # the app is built with.
          package="$(sed -n 's/^ *applicationId = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          if [ -z "$package" ]; then
            echo "::error::No applicationId found in android/app/build.gradle.kts"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "version_code=$code"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"
            echo "VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      # Cheap on a job that already has the SDK warm, and this is the one build
      # whose output cannot be quietly replaced once people have downloaded it.
      - run: flutter test

      # Signing material scoped to these two steps rather than the whole job.
      # android/app/build.gradle.kts falls back to the debug key when it is
      # absent, which is what the check below catches.
      #
      # Play takes the bundle and the release carries the APK; they share a
      # version code so moving between the two is never a downgrade.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number="$VERSION_CODE"

      - name: Build the App Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      # Catches a debug-signed build before it ships. A debug-signed APK
      # installs fine and only breaks the *next* release, which will not install
      # over it; Play rejects one as an unrecognised upload key, which points at
      # a Play misconfiguration rather than at missing secrets.
      #
      # Two tools: apksigner reads an APK's signature block, a bundle is a
      # signed jar and needs keytool.
      - name: Check both artifacts are signed with the release key
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The release APK is signed with the debug key"
            exit 1
          fi
          echo "SIGNER=$(grep -m1 'SHA-256 digest' <<<"$certs" | awk '{print $NF}')" \
            >> "$GITHUB_ENV"

          bundle_certs="$(keytool -printcert -jarfile \
            build/app/outputs/bundle/release/app-release.aab)"
          echo "$bundle_certs"
          if grep -q 'CN=Android Debug' <<<"$bundle_certs"; then
            echo "::error::The App Bundle is signed with the debug key"
            exit 1
          fi

      # Named here so both leave the job under the name they will carry.
      - name: Name the artifacts after the release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/prosefchi-$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/prosefchi-$VERSION.aab"

      # Two artifacts, so each publisher downloads only what it publishes.
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/prosefchi-${{ env.VERSION }}.apk
          if-no-files-found: error
          # Long enough to re-run a publisher by hand after a rejection.
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/prosefchi-${{ env.VERSION }}.aab
          if-no-files-found: error
          retention-days: 7

      - name: Report what was built
        run: |
          set -euo pipefail
          {
            echo "### prosefchi-$VERSION"
            echo
            echo '```'
            (cd dist && sha256sum "prosefchi-$VERSION.apk" "prosefchi-$VERSION.aab")
            echo "signing certificate  $SIGNER"
            echo "version code         $VERSION_CODE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: build
    uses: ./.github/workflows/publish-github.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}

  play:
    needs: build
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.version_code }}
      package: ${{ needs.build.outputs.package }}
      # Absent on a release event, where `inputs` is empty and this is false.
      publish: ${{ inputs.publish == true }}
    secrets:
      service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
