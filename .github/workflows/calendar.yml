name: Pages

# Builds everything published to GitHub Pages and deploys it: the calendar JSON
# the app fetches, and the web frontend that reads the same JSON.
#
# The calendar is rebuilt from the GOARCH feeds, which are ~32 MB and served
# with `no-store`, so that runs here once a day rather than on every user's
# device.
#
# **Both are built on every run, and that is load-bearing.** A Pages deploy
# replaces the whole site with the uploaded artifact, so a run that built only
# the calendar would publish a directory with no web frontend in it and take
# the site down until the next push.

on:
  schedule:
    # Deliberately off the hour: GitHub queues scheduled runs heavily at :00 and
    # delays are routine. Nothing here is time-critical, so a late run is fine.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tool/build_calendar.dart'
      - 'tool/build_site.dart'
      - 'lib/models/calendar.dart'
      # The site compiles the liturgics into its JavaScript and renders the
      # prayers through the app's own parser, so a change to any of them
      # changes what is published.
      - 'lib/liturgics/**'
      - 'lib/models/markup.dart'
      - 'lib/models/prayer.dart'
      - 'lib/l10n/*.arb'
      - 'site/**'
      - 'res/prayers/**'
      - 'pubspec.yaml'
      - '.github/workflows/calendar.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a scheduled run
# cannot discard a manually triggered one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tool is plain Dart, but pubspec.yaml depends on the Flutter SDK, so
      # `dart pub get` cannot resolve without Flutter present.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # The generator writes through lib/models/calendar.dart and the site
      # renders through lib/models/markup.dart, so a break in either would
      # publish something wrong to every client. Cheap gate for the cost of a
      # few seconds on a job that already has the SDK warm.
      - run: flutter test

      # Before the calendar, so a broken site fails the run in seconds rather
      # than after ~32 MB has been downloaded from upstream.
      - name: Build site
        run: dart run tool/build_site.dart --out public

      - name: Build calendar
        run: |
          set -eo pipefail
          dart run tool/build_calendar.dart --out public 2>&1 | tee build.log

      # The feed has a hard end date and simply stops rather than rolling
      # forward. Surface that on the run page, not just buried in the log.
      - name: Report feed runway
        run: |
          {
            echo '### Calendar build'
            echo
            echo '```'
            grep -E '^(en|el): [0-9]+ days|^  upstream last modified' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'WARNING' build.log; then
            grep 'WARNING' build.log | while read -r line; do
              echo "::warning title=Calendar feed runway::${line#*WARNING: }"
            done
            {
              echo
              echo '> [!WARNING]'
              grep 'WARNING' build.log | sed 's/^ *WARNING: /> /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
