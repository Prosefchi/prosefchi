<!--
  The tab icon: the app's notification cross on the brand red.

  The cross is android/app/src/main/res/drawable-xxxhdpi/ic_notification.png,
  embedded here rather than linked so this file is self-contained. That
  drawable is an ALPHA MASK: Android reads only its alpha and paints the
  result itself, so the artwork is a white cross on transparent. Used bare in
  a browser tab it would be white on white and simply vanish, which is why it
  sits on the #7b1113 plate here — the same red lib/main.dart seeds the app
  theme from, and the same one the launcher icon uses.

  If the cross artwork is ever redrawn, regenerate this file from the same
  drawable rather than editing the base64 by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"><rect width="96" height="96" rx="20" fill="#7b1113"/><image x="8" y="8" width="80" height="80" href="data:image/png;base64,"/></svg>
