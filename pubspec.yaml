name: prosefchi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.4.0

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # `any` deliberately: flutter_localizations pins intl itself, and a explicit
  # constraint here just fights it on every SDK bump.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Fetching the calendar, and somewhere on disk to keep it between launches.
  http: ^1.6.0
  path_provider: ^2.1.6

  # Reminders are scheduled on the device rather than pushed from a server.
  # They are exact, work with no signal, cost nothing to run, and mean the app
  # never learns when anyone prays. timezone is required by the scheduler;
  # flutter_timezone supplies the device's IANA zone name to seed it.
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5

  # The about section: opening the repository, and reading the version out of
  # the bundle rather than restating it here where it would drift.
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the platform icon sets from assets/icon/. Run after changing
  # them: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  # DOM bindings for site/day.dart, which tool/build_site.dart compiles to
  # JavaScript for the web frontend. A dev dependency because nothing under
  # lib/ may import it: the app never runs in a browser, and the site is a
  # build output rather than something the app ships.
  web: ^1.1.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb. See l10n.yaml.
  generate: true

  # Prayers are bundled because they must work with no signal at all, and are
  # authored content that does not change between releases. The calendar is
  # not: its window is short enough that a shipped copy would expire before
  # many users updated the app, so it is fetched and stored instead.
  #
  # Files sit directly in res/prayers/ rather than in per-language or per-time
  # subdirectories, so this one entry covers all of them. Directory entries are
  # not recursive: a subdirectory added later needs its own line here, and a
  # missing asset fails at runtime rather than at build.
  assets:
    - res/
    - res/prayers/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Source images live in assets/icon/ and are deliberately not declared under
# flutter.assets above: they are build inputs for the icon generator, not
# something the app loads at runtime.
flutter_launcher_icons:
  image_path: assets/icon/icon.png

  android: true
  # The legacy launcher icon for older Android. Adaptive icons get the two
  # layers instead, because a circular mask cuts straight through the
  # firesteels when the emblem runs close to the edge.
  adaptive_icon_background: "#BB0602"
  # The artwork is inset in the source as well as by the 16% the generator
  # writes into the adaptive XML. Belt and braces, but it is what looks right
  # on a real launcher: the emblem reads as a seal rather than crowding the
  # mask edge.
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  # The themed-icon mask for Android 13+. Its own file, not the foreground
  # again: the launcher reads only the alpha, so the foreground's shadow would
  # arrive as extra cross rather than as shadow.
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome.png

  ios: true
  # iOS forbids transparency in app icons and rejects builds that carry it.
  remove_alpha_ios: true
