<!--
  Prosefchi. The website icon. The same artwork with flat gold, for the site and for
  any size too small to hold the ramp.

  The Byzantine imperial flag: a Greek cross with a firesteel in each quarter.
  One traced firesteel placed four times, mirrored left to right and repeated
  top to bottom, so the four cannot drift apart. The `d` of #firesteel is the
  same string in every master here; test/icon_masters_test.dart holds it so.

  Do not hand-edit the path. It was traced from the original raster and is
  accurate to well under a pixel; a manual touch-up would lose that quietly.
-->
